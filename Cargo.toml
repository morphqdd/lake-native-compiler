[package]
name = "lakec"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4", features = ["derive"] }
console = "0.15"
indicatif = "0.17"
log = "0.4"
env_logger = "0.11"
base64ct = {version = "1.8.2", features = ['alloc']}
# blink = { git = "https://github.com/morphqdd/blink", version = "0.0.0" }
# Stays on 0.127 until a wasmtime release ships the
# Aarch64AdrPrelPgHi21 ObjectModule relocation handler that lives on
# `main` today.  Upgrading to git main also breaks MemFlags →
# MemFlagsData (≈30+ call sites) plus other internals — out of scope
# for the ARM-port batch.  Track upstream wasmtime cranelift-v0.132
# (or later) and bump together with the rename migration.
cranelift = { version = "0.127.0", features = ["module", "native", "object"] }
cranelift-wasm = "0.112.3"
chumsky = { git = "https://github.com/zesterer/chumsky.git", features = ["pratt"] }
lake-frontend = { git = "https://github.com/morphqdd/lake_frontend.git", branch = "dev" }
num_cpus = "1.17.0"

[dev-dependencies]
tempfile = "3.24.0"

[build-dependencies]
anyhow = "1.0.100"

# Nightly-only: incremental compilation in release mode.  Cuts
# repeat-build time 5-10× when only a small slice of lake-frontend
# or src/ changes.  Costs ~5% on first build + a bit of disk.
[profile.release]
incremental = true

# Fast iteration profile.  Same correctness as release, lower codegen
# effort.  Use `cargo build --profile release-fast` /
# `cargo test --profile release-fast` for dev loops; benchmarks
# and shipping builds keep the plain `--release` profile.
[profile.release-fast]
inherits = "release"
opt-level = 1
codegen-units = 256
lto = false
debug-assertions = false
overflow-checks = false


# Local path override while the cross-module record fix (frontend
# commit a446836) is unpushed.  Remove once `dev` is up to date.
[patch."https://github.com/morphqdd/lake_frontend.git"]
lake-frontend = { path = "../lake-frontend" }

